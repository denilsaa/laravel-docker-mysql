services:
  app:
    build: .
    container_name: mi_laravel_app
    working_dir: /var/www

    ports:
      - "8000:8000"

    volumes:
      - .:/var/www

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: laravel123

    depends_on:
      mysql:
        condition: service_healthy

    command: >
      sh -c '
        set -e;

        if [ ! -f artisan ]; then
          echo "======================================";
          echo " Creando proyecto Laravel...";
          echo "======================================";

          composer create-project laravel/laravel /tmp/laravel --prefer-dist --no-interaction;
          cp -a /tmp/laravel/. /var/www/;
          rm -rf /tmp/laravel;
        fi;

        if [ ! -f .env ]; then
          cp .env.example .env;
        fi;

        if [ ! -f vendor/autoload.php ]; then
          composer install --no-interaction;
        fi;

        sed -i
          -e "s/^DB_CONNECTION=.*/DB_CONNECTION=mysql/"
          -e "s/^# DB_HOST=.*/DB_HOST=mysql/"
          -e "s/^# DB_PORT=.*/DB_PORT=3306/"
          -e "s/^# DB_DATABASE=.*/DB_DATABASE=laravel/"
          -e "s/^# DB_USERNAME=.*/DB_USERNAME=laravel/"
          -e "s/^# DB_PASSWORD=.*/DB_PASSWORD=laravel123/"
          .env;

        grep -q "^DB_HOST=" .env || echo "DB_HOST=mysql" >> .env;
        grep -q "^DB_PORT=" .env || echo "DB_PORT=3306" >> .env;
        grep -q "^DB_DATABASE=" .env || echo "DB_DATABASE=laravel" >> .env;
        grep -q "^DB_USERNAME=" .env || echo "DB_USERNAME=laravel" >> .env;
        grep -q "^DB_PASSWORD=" .env || echo "DB_PASSWORD=laravel123" >> .env;

        grep -q "^APP_KEY=base64:" .env || php artisan key:generate --force;

        echo "======================================";
        echo " Ejecutando migraciones en MySQL...";
        echo "======================================";

        php artisan migrate --force;

        echo "======================================";
        echo " Laravel disponible en:";
        echo " http://localhost:8000";
        echo "======================================";

        exec php artisan serve --host=0.0.0.0 --port=8000
      '

  mysql:
    image: mysql:8.4
    container_name: mi_laravel_mysql

    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel123
      MYSQL_ROOT_PASSWORD: root123

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
